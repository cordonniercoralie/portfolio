  :root {
    --fond: #EEE9E3;
    --encre: #141414;
    --orange: #F95E2E;
    --pastille: #FBF9F6;
    --gris: #5E5853;
    --titre: "Unbounded", "Arial Black", system-ui, sans-serif;
    --texte: "Silka", system-ui, -apple-system, sans-serif;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  *, *::before, *::after { box-sizing: inherit; margin: 0; }

  html, body { height: 100%; }
  body {
    background: var(--fond);
    color: var(--encre);
    font-family: var(--texte);
    font-weight: 300;
    overflow-x: hidden;
    position: relative;
  }

  /* ---------- Illustrations (tes propres SVG) ---------- */
  .illu { position: fixed; pointer-events: none; z-index: 0; }
  .illu--haut { top: -2rem; left: -2.5rem; width: clamp(120px, 22vw, 240px); transform: rotate(-12deg); }
  .illu--bas { bottom: -3rem; right: -2rem; width: clamp(200px, 34vw, 420px); }

  /* ---------- Mise en page ---------- */
  main {
    position: relative;
    z-index: 1;
    min-height: 100%;
    display: grid;
    grid-template-rows: auto 1fr auto;
    padding: clamp(1.25rem, 4vw, 2.5rem);
    max-width: 1100px;
    margin: 0 auto;
  }

  /* ---------- Pastille de statut ---------- */
  .statut {
    justify-self: center;
    display: inline-flex;
    align-items: center;
    gap: 1.1rem;
    background: var(--pastille);
    border-radius: 999px;
    padding: .75rem 1.6rem .75rem 1.5rem;
    box-shadow: 0 0 0 6px rgba(255,255,255,.35);
  }
  .logo { height: clamp(26px, 6vw, 34px); width: auto; display: block; }
  .etat {
    display: inline-flex;
    align-items: center;
    gap: .65rem;
    font-size: clamp(1rem, 2.6vw, 1.2rem);
    color: var(--gris);
  }

  /* Le point : l’inverse du « Disponible » vert qui pulse.
     Ici il est orange, il respire lentement… et il dort. */
  .point {
    position: relative;
    width: 12px; height: 12px;
    border-radius: 50%;
    background: var(--orange);
    animation: respire 3.2s ease-in-out infinite;
  }
  .z {
    position: absolute;
    left: 10px; bottom: 8px;
    font-family: var(--titre);
    font-weight: 600;
    color: var(--orange);
    font-size: .65rem;
    opacity: 0;
    animation: zzz 3.6s ease-out infinite;
  }
  .z:nth-child(2) { animation-delay: 1.2s; font-size: .78rem; }
  .z:nth-child(3) { animation-delay: 2.4s; font-size: .9rem; }

  @keyframes respire {
    0%, 100% { transform: scale(.75); opacity: .55; }
    50%      { transform: scale(1);   opacity: 1; }
  }
  @keyframes zzz {
    0%   { opacity: 0; transform: translate(0, 0) rotate(-10deg); }
    25%  { opacity: 1; }
    100% { opacity: 0; transform: translate(14px, -26px) rotate(12deg); }
  }

  /* ---------- Titre ---------- */
  .contenu {
    align-self: center;
    text-align: center;
    padding: clamp(3rem, 10vh, 6rem) 0;
  }
  h1 {
    font-family: var(--titre);
    font-weight: 600;
    font-size: clamp(1.55rem, 6.8vw, 4.6rem);
    line-height: 1.12;
    letter-spacing: -.03em;
    margin: 0 auto;
  }
  h1 .mot {
    font-family: var(--texte);
    font-weight: 300;
    color: var(--orange);
    text-transform: uppercase;
    letter-spacing: -.01em;
    font-size: 1.12em;
  }
  .intro {
    margin: clamp(1.5rem, 4vh, 2.25rem) auto 0;
    max-width: 36ch;
    font-size: clamp(1.05rem, 2.4vw, 1.25rem);
    line-height: 1.55;
    color: var(--gris);
  }

  /* ---------- Contact ---------- */
  .actions {
    margin-top: clamp(1.75rem, 5vh, 2.75rem);
    display: flex;
    flex-wrap: wrap;
    gap: .75rem;
    justify-content: center;
  }
  .bouton {
    display: inline-flex;
    align-items: center;
    min-height: 52px;
    padding: 0 1.6rem;
    border-radius: 999px;
    font-family: var(--titre);
    font-weight: 500;
    font-size: .95rem;
    line-height: 1;
    text-decoration: none;
    transition: transform .2s ease, background-color .2s ease, color .2s ease;
  }
  .bouton--plein { background: var(--orange); color: #fff; }
  .bouton--plein:hover { background: #E54E20; transform: translateY(-2px); }
  .bouton--contour { color: var(--encre); box-shadow: inset 0 0 0 2px var(--encre); }
  .bouton--contour:hover { background: var(--encre); color: var(--fond); }
  .bouton:focus-visible, footer a:focus-visible { outline: 3px solid var(--encre); outline-offset: 3px; }

  /* ---------- Pied de page ---------- */
  footer {
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: center;
    gap: .5rem 2rem;
    padding-top: 1.25rem;
    border-top: 1px solid rgba(20,20,20,.12);
    font-size: .9rem;
    color: var(--gris);
  }
  footer p { display: flex; flex-wrap: wrap; gap: .25rem 1.25rem; }
  footer a { color: inherit; text-underline-offset: 3px; }
  footer a:hover { color: var(--orange); }
  @media (max-width: 640px) {
    footer { flex-direction: column; text-align: center; }
    footer p { justify-content: center; }
  }

  @media (prefers-reduced-motion: reduce) {
    .point, .z { animation: none; }
    .point { opacity: 1; transform: none; }
    .bouton { transition: none; }
  }
</style>
</head>
